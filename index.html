<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NI Strain & Fatigue Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #182235;
      --panel: #1b2740;
      --border: rgba(255, 255, 255, 0.14);
      --text: #eef2f7;
      --muted: #b2bfd4;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --blue: #60a5fa;
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.18);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.24), transparent 34%),
        radial-gradient(circle at top right, rgba(74, 222, 128, 0.18), transparent 30%),
        radial-gradient(circle at center top, rgba(255, 255, 255, 0.05), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    body {
      padding: 24px;
    }

    .app {
      max-width: 1680px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .title-block p {
      margin: 8px 0 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.16);
      flex: 0 0 auto;
    }

    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16);
    }

    .dot.bad {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.16);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .meta-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      min-height: 84px;
      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.05);
      display: grid;
      align-content: start;
      gap: 8px;
      backdrop-filter: blur(6px);
    }

    .meta-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .meta-value {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.01em;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .chart-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.05);
      min-height: 660px;
      display: grid;
      grid-template-rows: auto auto 1fr 1fr auto;
      gap: 12px;
      backdrop-filter: blur(6px);
    }

    .chart-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chart-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .channel-badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.16);
      color: #dbeafe;
      border: 1px solid rgba(96, 165, 250, 0.24);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-mini {
      padding: 7px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.09);
      font-size: 12px;
      color: var(--muted);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .stat-mini strong {
      color: var(--text);
      font-weight: 700;
      margin-left: 4px;
    }

    .stat-mini.damage strong {
      color: #fde68a;
    }

    .canvas-block {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      min-height: 0;
    }

    .canvas-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .canvas-wrap {
      position: relative;
      min-height: 220px;
      cursor: zoom-in;
      border-radius: 14px;
      overflow: hidden;
    }

    .canvas-wrap canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .download-btn {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.09);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .download-btn:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-1px);
    }

    .chart-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 10, 20, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
      backdrop-filter: blur(6px);
    }

    .chart-modal.open {
      display: flex;
    }

    .chart-modal-content {
      width: min(96vw, 1400px);
      height: min(88vh, 900px);
      background: linear-gradient(180deg, rgba(27,39,64,0.98), rgba(24,34,53,0.98));
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .chart-modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chart-modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .chart-modal-close {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .chart-modal-canvas-wrap {
      position: relative;
      min-height: 0;
      height: 100%;
    }

    .chart-modal-canvas-wrap canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    @media (max-width: 1500px) {
      .meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .charts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .title-block h1 {
        font-size: 26px;
      }

      .meta-grid {
        grid-template-columns: 1fr;
      }

      .charts {
        grid-template-columns: 1fr;
      }

      .chart-card {
        min-height: 620px;
      }

      .chart-modal {
        padding: 12px;
      }

      .chart-modal-content {
        width: 100%;
        height: 90vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title-block">
        <h1>NI Strain & Fatigue Dashboard</h1>
        <p>Live monitoring of strain channels and cumulative fatigue damage D.</p>
      </div>

      <div class="status-chip">
        <span id="dot" class="dot"></span>
        <span id="statusText">CONNECTING...</span>
      </div>
    </div>

    <div class="meta-grid">
      <div class="meta-card">
        <div class="meta-label">Run ID</div>
        <div class="meta-value" id="runIdText">--</div>
      </div>

      <div class="meta-card">
        <div class="meta-label">File</div>
        <div class="meta-value" id="fileNameText">--</div>
      </div>

      <div class="meta-card">
        <div class="meta-label">Stats Unit</div>
        <div class="meta-value" id="unitText">microstrain</div>
      </div>

      <div class="meta-card">
        <div class="meta-label">Updated</div>
        <div class="meta-value" id="updatedAt">--</div>
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title">Channels AI0-AI3</h2>
      <div class="section-subtitle">Live strain and cumulative Miner damage history for each channel</div>
    </div>

    <div class="charts" id="charts"></div>
  </div>

  <div class="chart-modal" id="chartModal">
    <div class="chart-modal-content">
      <div class="chart-modal-top">
        <h3 class="chart-modal-title" id="chartModalTitle">Chart</h3>
        <button type="button" class="chart-modal-close" id="chartModalClose">Close</button>
      </div>

      <div class="chart-modal-canvas-wrap">
        <canvas id="chartModalCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://ni-live-monitor.yanovichvitaliy.workers.dev";
    const WS_URL = "wss://ni-live-monitor.yanovichvitaliy.workers.dev/ws";

    const MAX_STATS_POINTS = 1000;
    const MAX_FATIGUE_POINTS = 1000;
    const CHANNEL_KEYS = ["ai0", "ai1", "ai2", "ai3"];
    const FATIGUE_UNIT = "damage_fraction";

    const dot = document.getElementById("dot");
    const statusText = document.getElementById("statusText");
    const runIdText = document.getElementById("runIdText");
    const fileNameText = document.getElementById("fileNameText");
    const unitText = document.getElementById("unitText");
    const updatedAt = document.getElementById("updatedAt");
    const chartsEl = document.getElementById("charts");

    const chartModal = document.getElementById("chartModal");
    const chartModalTitle = document.getElementById("chartModalTitle");
    const chartModalClose = document.getElementById("chartModalClose");
    const chartModalCanvas = document.getElementById("chartModalCanvas");

    let activeRunId = null;
    let runStartMs = null;
    let lastUpdatedAtMs = null;

    const statsEls = {};
    const strainCharts = {};
    const damageCharts = {};
    const latestFatigueByChannel = {
      ai0: null,
      ai1: null,
      ai2: null,
      ai3: null
    };

    let modalChart = null;
    let modalSourceChart = null;
    let modalSourceTitle = "";

    function setStatus(text, mode) {
      statusText.textContent = text;
      dot.className = "dot" + (mode === "ok" ? " ok" : mode === "bad" ? " bad" : "");
    }

    function fmt(value, digits = 3) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(digits) : "--";
    }

    function getTimeAxisLabel(maxSeconds) {
      if (maxSeconds >= 3600) return "t (h)";
      if (maxSeconds >= 60) return "t (min)";
      return "t (s)";
    }

    function formatTimeTick(value) {
      const v = Number(value);

      if (v >= 3600) {
        const h = v / 3600;
        return (Number.isInteger(h) ? h.toFixed(0) : h.toFixed(1)) + " h";
      }

      if (v >= 60) {
        const m = v / 60;
        return (Number.isInteger(m) ? m.toFixed(0) : m.toFixed(1)) + " min";
      }

      return v.toFixed(0) + " s";
    }

    function downloadTextFile(filename, content, contentType = "text/csv;charset=utf-8;") {
      const blob = new Blob([content], { type: contentType });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    }

    function buildStrainCsv() {
      const meanSeries = {};

      for (const key of CHANNEL_KEYS) {
        const chart = strainCharts[key];
        meanSeries[key] = chart ? chart.data.datasets[0].data : [];
      }

      const timeMap = new Map();

      for (const key of CHANNEL_KEYS) {
        for (const point of meanSeries[key]) {
          if (!point || !Number.isFinite(point.x)) continue;

          const t = Number(point.x).toFixed(3);

          if (!timeMap.has(t)) {
            timeMap.set(t, { t, ai0: "", ai1: "", ai2: "", ai3: "" });
          }

          timeMap.get(t)[key] = Number(point.y).toFixed(3);
        }
      }

      const rows = [];
      rows.push(["t", "ai0", "ai1", "ai2", "ai3"]);

      const sorted = Array.from(timeMap.values()).sort((a, b) => Number(a.t) - Number(b.t));

      for (const row of sorted) {
        rows.push([row.t, row.ai0, row.ai1, row.ai2, row.ai3]);
      }

      return rows.map(row => row.join(";")).join("\n");
    }

    function buildDamageCsv() {
      const damageSeries = {};

      for (const key of CHANNEL_KEYS) {
        const chart = damageCharts[key];
        damageSeries[key] = chart ? chart.data.datasets[0].data : [];
      }

      const timeMap = new Map();

      for (const key of CHANNEL_KEYS) {
        for (const point of damageSeries[key]) {
          if (!point || !Number.isFinite(point.x)) continue;

          const t = Number(point.x).toFixed(3);

          if (!timeMap.has(t)) {
            timeMap.set(t, { t, ai0: "", ai1: "", ai2: "", ai3: "" });
          }

          timeMap.get(t)[key] = Number(point.y).toFixed(6);
        }
      }

      const rows = [];
      rows.push(["t", "ai0_damage", "ai1_damage", "ai2_damage", "ai3_damage"]);

      const sorted = Array.from(timeMap.values()).sort((a, b) => Number(a.t) - Number(b.t));

      for (const row of sorted) {
        rows.push([row.t, row.ai0, row.ai1, row.ai2, row.ai3]);
      }

      return rows.map(row => row.join(";")).join("\n");
    }

    function downloadStrainCsv() {
      const csv = buildStrainCsv();
      const runId = activeRunId || "no_run";
      downloadTextFile(`strain_${runId}.csv`, csv);
    }

    function downloadDamageCsv() {
      const csv = buildDamageCsv();
      const runId = activeRunId || "no_run";
      downloadTextFile(`fatigue_damage_${runId}.csv`, csv);
    }

    function deepClone(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function buildModalOptions(sourceChart) {
      const options = deepClone(sourceChart.options || {});
      options.responsive = true;
      options.maintainAspectRatio = false;
      options.animation = false;
      return options;
    }

    function openChartModal(sourceChart, title) {
      modalSourceChart = sourceChart;
      modalSourceTitle = title;
      chartModalTitle.textContent = title;

      if (modalChart) {
        modalChart.destroy();
        modalChart = null;
      }

      const ctx = chartModalCanvas.getContext("2d");

      modalChart = new Chart(ctx, {
        type: sourceChart.config.type,
        data: deepClone(sourceChart.data),
        options: buildModalOptions(sourceChart)
      });

      chartModal.classList.add("open");
    }

    function syncModalChart() {
      if (!modalChart || !modalSourceChart) return;

      modalChart.data = deepClone(modalSourceChart.data);
      modalChart.options = buildModalOptions(modalSourceChart);
      modalChart.update("none");
    }

    function closeChartModal() {
      chartModal.classList.remove("open");

      if (modalChart) {
        modalChart.destroy();
        modalChart = null;
      }

      modalSourceChart = null;
      modalSourceTitle = "";
    }

    chartModalClose.addEventListener("click", closeChartModal);

    chartModal.addEventListener("click", (e) => {
      if (e.target === chartModal) {
        closeChartModal();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && chartModal.classList.contains("open")) {
        closeChartModal();
      }
    });

    function makeCard(channelKey) {
      const upper = channelKey.toUpperCase();

      const card = document.createElement("div");
      card.className = "chart-card";

      const top = document.createElement("div");
      top.className = "chart-top";

      const title = document.createElement("h3");
      title.className = "chart-title";
      title.textContent = upper;

      const badge = document.createElement("div");
      badge.className = "channel-badge";
      badge.textContent = "CHANNEL";

      top.appendChild(title);
      top.appendChild(badge);

      const stats = document.createElement("div");
      stats.className = "stats";
      stats.id = `stats-${channelKey}`;
      stats.innerHTML = `
        <div class="stat-mini">Mean<strong>--</strong></div>
        <div class="stat-mini">Min<strong>--</strong></div>
        <div class="stat-mini">Max<strong>--</strong></div>
        <div class="stat-mini damage">Damage D<strong>--</strong></div>
      `;

      const strainBlock = document.createElement("div");
      strainBlock.className = "canvas-block";

      const strainLabel = document.createElement("div");
      strainLabel.className = "canvas-label";
      strainLabel.textContent = "Strain history";

      const strainWrap = document.createElement("div");
      strainWrap.className = "canvas-wrap";

      const strainCanvas = document.createElement("canvas");
      strainCanvas.id = `chart-strain-${channelKey}`;
      strainWrap.appendChild(strainCanvas);

      strainBlock.appendChild(strainLabel);
      strainBlock.appendChild(strainWrap);

      const damageBlock = document.createElement("div");
      damageBlock.className = "canvas-block";

      const damageLabel = document.createElement("div");
      damageLabel.className = "canvas-label";
      damageLabel.textContent = "Fatigue damage D";

      const damageWrap = document.createElement("div");
      damageWrap.className = "canvas-wrap";

      const damageCanvas = document.createElement("canvas");
      damageCanvas.id = `chart-damage-${channelKey}`;
      damageWrap.appendChild(damageCanvas);

      damageBlock.appendChild(damageLabel);
      damageBlock.appendChild(damageWrap);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const btnStrain = document.createElement("button");
      btnStrain.type = "button";
      btnStrain.className = "download-btn";
      btnStrain.textContent = "Download Strain CSV";
      btnStrain.addEventListener("click", downloadStrainCsv);

      const btnDamage = document.createElement("button");
      btnDamage.type = "button";
      btnDamage.className = "download-btn";
      btnDamage.textContent = "Download Damage D CSV";
      btnDamage.addEventListener("click", downloadDamageCsv);

      actions.appendChild(btnStrain);
      actions.appendChild(btnDamage);

      card.appendChild(top);
      card.appendChild(stats);
      card.appendChild(strainBlock);
      card.appendChild(strainBlock.cloneNode(false)); // temporary placeholder removal safeguard
      card.removeChild(card.lastChild);
      card.appendChild(damageBlock);
      card.appendChild(actions);

      chartsEl.appendChild(card);

      statsEls[channelKey] = stats;

      const strainChart = makeStrainChart(strainCanvas.id, upper);
      const damageChart = makeDamageChart(damageCanvas.id, upper);

      strainCharts[channelKey] = strainChart;
      damageCharts[channelKey] = damageChart;

      strainWrap.addEventListener("click", () => {
        openChartModal(strainChart, `${upper} — Strain history`);
      });

      damageWrap.addEventListener("click", () => {
        openChartModal(damageChart, `${upper} — Fatigue damage D`);
      });
    }

    function makeStrainChart(canvasId, label) {
      const ctx = document.getElementById(canvasId).getContext("2d");

      return new Chart(ctx, {
        type: "line",
        data: {
          datasets: [
            {
              label: label + " mean",
              data: [],
              borderColor: "#22c55e",
              backgroundColor: "#22c55e",
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 3,
              tension: 0.15,
              fill: false,
              order: 3
            },
            {
              label: label + " max",
              data: [],
              borderColor: "rgba(239,68,68,0)",
              backgroundColor: "rgba(255,120,120,0.30)",
              borderWidth: 0,
              pointRadius: 0,
              pointHoverRadius: 0,
              tension: 0.15,
              fill: { target: 0 },
              order: 1
            },
            {
              label: label + " min",
              data: [],
              borderColor: "rgba(59,130,246,0)",
              backgroundColor: "rgba(59,130,246,0.20)",
              borderWidth: 0,
              pointRadius: 0,
              pointHoverRadius: 0,
              tension: 0.15,
              fill: { target: 0 },
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          parsing: false,
          normalized: true,
          interaction: {
            mode: "index",
            intersect: false
          },
          scales: {
            x: {
              type: "linear",
              title: { display: true, text: "t (s)", color: "#b2bfd4" },
              ticks: {
                color: "#b2bfd4",
                maxTicksLimit: 6,
                callback(value) {
                  return formatTimeTick(value);
                }
              },
              grid: { color: "rgba(255,255,255,0.07)" }
            },
            y: {
              title: { display: true, text: "microstrain", color: "#b2bfd4" },
              ticks: { color: "#b2bfd4", maxTicksLimit: 6 },
              grid: { color: "rgba(255,255,255,0.07)" }
            }
          },
          plugins: {
            legend: {
              labels: {
                color: "#dbe4f0",
                boxWidth: 12,
                font: { size: 11 }
              }
            },
            tooltip: {
              backgroundColor: "rgba(15, 23, 42, 0.96)",
              borderColor: "rgba(255,255,255,0.12)",
              borderWidth: 1,
              callbacks: {
                title(items) {
                  if (!items || !items.length) return "";
                  return "t: " + formatTimeTick(items[0].parsed.x);
                },
                label(context) {
                  const y = Number(context.parsed.y).toFixed(3);
                  if (context.datasetIndex === 0) return `${label} mean: ${y}`;
                  if (context.datasetIndex === 1) return `${label} max: ${y}`;
                  if (context.datasetIndex === 2) return `${label} min: ${y}`;
                  return null;
                }
              }
            }
          }
        }
      });
    }

    function makeDamageChart(canvasId, label) {
      const ctx = document.getElementById(canvasId).getContext("2d");

      return new Chart(ctx, {
        type: "line",
        data: {
          datasets: [
            {
              label: label + " damage D",
              data: [],
              borderColor: "#f59e0b",
              backgroundColor: "rgba(245,158,11,0.18)",
              borderWidth: 2,
              pointRadius: 2,
              pointHoverRadius: 4,
              tension: 0.12,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          parsing: false,
          normalized: true,
          interaction: {
            mode: "nearest",
            intersect: false
          },
          scales: {
            x: {
              type: "linear",
              title: { display: true, text: "t (s)", color: "#b2bfd4" },
              ticks: {
                color: "#b2bfd4",
                maxTicksLimit: 6,
                callback(value) {
                  return formatTimeTick(value);
                }
              },
              grid: { color: "rgba(255,255,255,0.07)" }
            },
            y: {
              title: { display: true, text: "damage D", color: "#b2bfd4" },
              ticks: { color: "#b2bfd4", maxTicksLimit: 6 },
              grid: { color: "rgba(255,255,255,0.07)" },
              min: 0
            }
          },
          plugins: {
            legend: {
              labels: {
                color: "#dbe4f0",
                boxWidth: 12,
                font: { size: 11 }
              }
            },
            tooltip: {
              backgroundColor: "rgba(15, 23, 42, 0.96)",
              borderColor: "rgba(255,255,255,0.12)",
              borderWidth: 1,
              callbacks: {
                title(items) {
                  if (!items || !items.length) return "";
                  return "t: " + formatTimeTick(items[0].parsed.x);
                },
                label(context) {
                  return `${label} damage D: ${Number(context.parsed.y).toFixed(6)}`;
                }
              }
            }
          }
        }
      });
    }

    function clearChart(chart) {
      chart.data.datasets.forEach(ds => ds.data = []);
      chart.options.scales.x.title.text = "t (s)";
      chart.update("none");

      if (modalSourceChart === chart) {
        syncModalChart();
      }
    }

    function clearAllCharts() {
      for (const key of CHANNEL_KEYS) {
        clearChart(strainCharts[key]);
        clearChart(damageCharts[key]);
      }
    }

    function resetStatsText() {
      for (const key of CHANNEL_KEYS) {
        latestFatigueByChannel[key] = null;
        statsEls[key].innerHTML = `
          <div class="stat-mini">Mean<strong>--</strong></div>
          <div class="stat-mini">Min<strong>--</strong></div>
          <div class="stat-mini">Max<strong>--</strong></div>
          <div class="stat-mini damage">Damage D<strong>--</strong></div>
        `;
      }
    }

    function renderStatsRow(channelKey, statsChannel = null) {
      const fatigue = latestFatigueByChannel[channelKey];
      const damageText = fatigue ? fmt(fatigue.damage, 6) : "--";

      const meanText = statsChannel ? fmt(statsChannel.mean) : "--";
      const minText = statsChannel ? fmt(statsChannel.min) : "--";
      const maxText = statsChannel ? fmt(statsChannel.max) : "--";

      statsEls[channelKey].innerHTML = `
        <div class="stat-mini">Mean<strong>${meanText}</strong></div>
        <div class="stat-mini">Min<strong>${minText}</strong></div>
        <div class="stat-mini">Max<strong>${maxText}</strong></div>
        <div class="stat-mini damage">Damage D<strong>${damageText}</strong></div>
      `;
    }

    function switchToRun(payload) {
      activeRunId = payload.run_id || null;
      runStartMs = payload.run_started_at ? Date.parse(payload.run_started_at) : null;

      runIdText.textContent = activeRunId || "--";
      fileNameText.textContent = payload.file_name || "--";
      updatedAt.textContent = payload.updated_at || "--";
      lastUpdatedAtMs = null;

      if (payload.unit && payload.unit !== FATIGUE_UNIT) {
        unitText.textContent = payload.unit;
      } else if (!payload.unit) {
        unitText.textContent = "microstrain";
      }

      clearAllCharts();
      resetStatsText();

      if (chartModal.classList.contains("open")) {
        closeChartModal();
      }
    }

    function appendStrainPoint(chart, x, mean, min, max) {
      const dsMean = chart.data.datasets[0].data;
      const dsMax = chart.data.datasets[1].data;
      const dsMin = chart.data.datasets[2].data;

      const lastMean = dsMean.length ? dsMean[dsMean.length - 1] : null;
      if (lastMean && lastMean.x === x) return;

      dsMean.push({ x, y: mean });
      dsMax.push({ x, y: max });
      dsMin.push({ x, y: min });

      if (dsMean.length > MAX_STATS_POINTS) {
        dsMean.splice(0, dsMean.length - MAX_STATS_POINTS);
        dsMax.splice(0, dsMax.length - MAX_STATS_POINTS);
        dsMin.splice(0, dsMin.length - MAX_STATS_POINTS);
      }

      const maxX = dsMean.length ? Number(dsMean[dsMean.length - 1].x) : 0;
      chart.options.scales.x.title.text = getTimeAxisLabel(maxX);

      chart.update("none");

      if (modalSourceChart === chart) {
        syncModalChart();
      }
    }

    function appendDamagePoint(chart, x, damage) {
      const ds = chart.data.datasets[0].data;
      const last = ds.length ? ds[ds.length - 1] : null;

      if (last && last.x === x) return;

      ds.push({ x, y: damage });

      if (ds.length > MAX_FATIGUE_POINTS) {
        ds.splice(0, ds.length - MAX_FATIGUE_POINTS);
      }

      const maxX = ds.length ? Number(ds[ds.length - 1].x) : 0;
      chart.options.scales.x.title.text = getTimeAxisLabel(maxX);

      chart.update("none");

      if (modalSourceChart === chart) {
        syncModalChart();
      }
    }

    function applyStatsPayload(payload) {
      if (!payload || !payload.channels) return;

      if (!activeRunId || payload.run_id !== activeRunId) {
        switchToRun(payload);
      }

      if (!runStartMs && payload.run_started_at) {
        runStartMs = Date.parse(payload.run_started_at);
      }

      const ts = payload._received_at || payload.updated_at || null;
      if (!ts) return;

      const ms = Date.parse(ts);
      if (!Number.isFinite(ms)) return;

      lastUpdatedAtMs = ms;
      updatedAt.textContent = ts;
      runIdText.textContent = payload.run_id || "--";
      fileNameText.textContent = payload.file_name || "--";
      unitText.textContent = payload.unit || "microstrain";

      const x = runStartMs ? ((ms - runStartMs) / 1000.0) : (ms / 1000.0);

      for (const key of CHANNEL_KEYS) {
        const channel = payload.channels[key];
        if (!channel) continue;

        renderStatsRow(key, channel);

        appendStrainPoint(
          strainCharts[key],
          x,
          Number(channel.mean),
          Number(channel.min),
          Number(channel.max)
        );
      }
    }

    function applyFatiguePayload(payload) {
      if (!payload || !payload.channels) return;

      if (!activeRunId || payload.run_id !== activeRunId) {
        switchToRun(payload);
      }

      if (!runStartMs && payload.run_started_at) {
        runStartMs = Date.parse(payload.run_started_at);
      }

      const ts = payload._received_at || payload.updated_at || null;
      if (!ts) return;

      const ms = Date.parse(ts);
      if (!Number.isFinite(ms)) return;

      lastUpdatedAtMs = ms;
      updatedAt.textContent = ts;
      runIdText.textContent = payload.run_id || "--";
      fileNameText.textContent = payload.file_name || "--";

      const x = runStartMs ? ((ms - runStartMs) / 1000.0) : (ms / 1000.0);

      for (const key of CHANNEL_KEYS) {
        const channel = payload.channels[key];
        if (!channel) continue;

        latestFatigueByChannel[key] = channel;
        renderStatsRow(key);

        appendDamagePoint(
          damageCharts[key],
          x,
          Number(channel.damage)
        );
      }
    }

    async function loadHistory() {
      try {
        const resp = await fetch(API_BASE + "/history", { cache: "no-store" });
        if (!resp.ok) return;

        const snapshot = await resp.json();
        if (!snapshot || !snapshot.run_id) return;

        const latestRef = snapshot.latest_stats || snapshot.latest_fatigue || null;

        switchToRun({
          run_id: snapshot.run_id,
          run_started_at: snapshot.run_started_at,
          file_name: snapshot.file_name,
          updated_at: latestRef?.updated_at || snapshot.run_started_at,
          unit: snapshot.latest_stats?.unit || "microstrain"
        });

        for (const point of snapshot.stats_points || []) {
          applyStatsPayload(point);
        }

        for (const point of snapshot.fatigue_points || []) {
          applyFatiguePayload(point);
        }
      } catch (e) {
        console.error("History load failed", e);
      }
    }

    setInterval(() => {
      if (!lastUpdatedAtMs) return;

      const currentAge = Math.max(0, Math.round((Date.now() - lastUpdatedAtMs) / 1000));

      if (currentAge <= 10) setStatus("LIVE", "ok");
      else if (currentAge <= 30) setStatus("STALE", "");
      else setStatus("OFFLINE", "bad");
    }, 1000);

    async function start() {
      for (const key of CHANNEL_KEYS) {
        makeCard(key);
      }

      await loadHistory();

      const ws = new WebSocket(WS_URL);

      ws.onopen = () => setStatus("CONNECTED", "ok");
      ws.onclose = () => setStatus("CLOSED", "bad");
      ws.onerror = () => setStatus("ERROR", "bad");

      ws.onmessage = (e) => {
        let msg;
        try {
          msg = JSON.parse(e.data);
        } catch {
          return;
        }

        const payload = msg.data || null;
        if (!payload) return;

        if (msg.type === "reset" || payload.reset === true) {
          switchToRun(payload);
          setStatus("NEW RUN", "ok");
          return;
        }

        if (msg.type === "stats" || payload.type === "stats") {
          applyStatsPayload(payload);
        } else if (msg.type === "fatigue" || payload.type === "fatigue") {
          applyFatiguePayload(payload);
        }

        setStatus("LIVE", "ok");
      };
    }

    start();
  </script>
</body>
</html>
