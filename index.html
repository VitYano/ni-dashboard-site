<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NI Strain Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel-2: #172033;
      --panel-3: #1f2a44;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(34, 197, 94, 0.08), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    body {
      padding: 24px;
    }

    .app {
      max-width: 1680px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .title-block p {
      margin: 8px 0 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.14);
      flex: 0 0 auto;
    }

    .dot.ok {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.14);
    }

    .dot.bad {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.14);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .meta-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      min-height: 84px;
      box-shadow: var(--shadow);
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .meta-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .meta-value {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.01em;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .chart-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      min-height: 380px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 10px;
    }

    .chart-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chart-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .channel-badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.12);
      color: #bfdbfe;
      border: 1px solid rgba(59, 130, 246, 0.18);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-mini {
      padding: 7px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
      color: var(--muted);
    }

    .stat-mini strong {
      color: var(--text);
      font-weight: 700;
      margin-left: 4px;
    }

    .canvas-wrap {
      position: relative;
      min-height: 0;
    }

    .canvas-wrap canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
    }

    .download-btn {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .download-btn:hover {
      background: rgba(255,255,255,0.10);
      transform: translateY(-1px);
    }

    @media (max-width: 1500px) {
      .meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .charts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .title-block h1 {
        font-size: 26px;
      }

      .meta-grid {
        grid-template-columns: 1fr;
      }

      .charts {
        grid-template-columns: 1fr;
      }

      .chart-card {
        min-height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title-block">
        <h1>NI Strain Dashboard</h1>
        <p>Live monitoring of strain channels with history and CSV export.</p>
      </div>

      <div class="status-chip">
        <span id="dot" class="dot"></span>
        <span id="statusText">CONNECTING...</span>
      </div>
    </div>

    <div class="meta-grid">
      <div class="meta-card">
        <div class="meta-label">Run ID</div>
        <div class="meta-value" id="runIdText">--</div>
      </div>

      <div class="meta-card">
        <div class="meta-label">File</div>
        <div class="meta-value" id="fileNameText">--</div>
      </div>

      <div class="meta-card">
        <div class="meta-label">Unit</div>
        <div class="meta-value" id="unitText">microstrain</div>
      </div>

      <div class="meta-card">
        <div class="meta-label">Updated</div>
        <div class="meta-value" id="updatedAt">--</div>
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title">Live strain</h2>
      <div class="section-subtitle">Mean, min and max for channels AI0-AI3</div>
    </div>

    <div class="charts" id="charts"></div>
  </div>

  <script>
    const API_BASE = "https://ni-live-monitor.yanovichvitaliy.workers.dev";
    const WS_URL = "wss://ni-live-monitor.yanovichvitaliy.workers.dev/ws";
    const MAX_POINTS = 1000;
    const CHANNEL_KEYS = ["ai0", "ai1", "ai2", "ai3"];

    const dot = document.getElementById("dot");
    const statusText = document.getElementById("statusText");
    const runIdText = document.getElementById("runIdText");
    const fileNameText = document.getElementById("fileNameText");
    const unitText = document.getElementById("unitText");
    const updatedAt = document.getElementById("updatedAt");
    const chartsEl = document.getElementById("charts");

    let activeRunId = null;
    let runStartMs = null;
    let lastUpdatedAtMs = null;

    const statsEls = {};
    const charts = {};

    function setStatus(text, mode) {
      statusText.textContent = text;
      dot.className = "dot" + (mode === "ok" ? " ok" : mode === "bad" ? " bad" : "");
    }

    function fmt(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(3) : "--";
    }

    function getTimeAxisLabel(maxSeconds) {
      if (maxSeconds >= 3600) return "t (h)";
      if (maxSeconds >= 60) return "t (min)";
      return "t (s)";
    }

    function formatTimeTick(value) {
      const v = Number(value);

      if (v >= 3600) {
        const h = v / 3600;
        return (Number.isInteger(h) ? h.toFixed(0) : h.toFixed(1)) + " h";
      }

      if (v >= 60) {
        const m = v / 60;
        return (Number.isInteger(m) ? m.toFixed(0) : m.toFixed(1)) + " min";
      }

      return v.toFixed(0) + " s";
    }

    function downloadTextFile(filename, content, contentType = "text/csv;charset=utf-8;") {
      const blob = new Blob([content], { type: contentType });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    }

    function buildWideCsv() {
      const meanSeries = {};

      for (const key of CHANNEL_KEYS) {
        const chart = charts[key];
        meanSeries[key] = chart ? chart.data.datasets[0].data : [];
      }

      const timeMap = new Map();

      for (const key of CHANNEL_KEYS) {
        for (const point of meanSeries[key]) {
          if (!point || !Number.isFinite(point.x)) continue;

          const t = Number(point.x).toFixed(3);

          if (!timeMap.has(t)) {
            timeMap.set(t, {
              t,
              ai0: "",
              ai1: "",
              ai2: "",
              ai3: ""
            });
          }

          timeMap.get(t)[key] = Number(point.y).toFixed(3);
        }
      }

      const rows = [];
      rows.push(["t", "ai0", "ai1", "ai2", "ai3"]);

      const sorted = Array.from(timeMap.values()).sort((a, b) => Number(a.t) - Number(b.t));

      for (const row of sorted) {
        rows.push([row.t, row.ai0, row.ai1, row.ai2, row.ai3]);
      }

      return rows.map(row => row.join(";")).join("\n");
    }

    function downloadWideCsv() {
      const csv = buildWideCsv();
      const runId = activeRunId || "no_run";
      downloadTextFile(`strain_${runId}.csv`, csv);
    }

    function makeCard(channelKey) {
      const upper = channelKey.toUpperCase();

      const card = document.createElement("div");
      card.className = "chart-card";

      const top = document.createElement("div");
      top.className = "chart-top";

      const title = document.createElement("h3");
      title.className = "chart-title";
      title.textContent = upper;

      const badge = document.createElement("div");
      badge.className = "channel-badge";
      badge.textContent = "CHANNEL";

      top.appendChild(title);
      top.appendChild(badge);

      const stats = document.createElement("div");
      stats.className = "stats";
      stats.id = `stats-${channelKey}`;
      stats.innerHTML = `
        <div class="stat-mini">Mean<strong>--</strong></div>
        <div class="stat-mini">Min<strong>--</strong></div>
        <div class="stat-mini">Max<strong>--</strong></div>
      `;

      const wrap = document.createElement("div");
      wrap.className = "canvas-wrap";

      const canvas = document.createElement("canvas");
      canvas.id = `chart-${channelKey}`;
      wrap.appendChild(canvas);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const button = document.createElement("button");
      button.type = "button";
      button.className = "download-btn";
      button.textContent = "Download CSV";
      button.addEventListener("click", downloadWideCsv);

      actions.appendChild(button);

      card.appendChild(top);
      card.appendChild(stats);
      card.appendChild(wrap);
      card.appendChild(actions);
      chartsEl.appendChild(card);

      statsEls[channelKey] = stats;
      charts[channelKey] = makeChart(canvas.id, upper);
    }

    function makeChart(canvasId, label) {
      const ctx = document.getElementById(canvasId).getContext("2d");

      return new Chart(ctx, {
        type: "line",
        data: {
          datasets: [
            {
              label: label + " mean",
              data: [],
              borderColor: "#22c55e",
              backgroundColor: "#22c55e",
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 3,
              tension: 0.15,
              fill: false,
              order: 3
            },
            {
              label: label + " max",
              data: [],
              borderColor: "rgba(239,68,68,0)",
              backgroundColor: "rgba(255,120,120,0.28)",
              borderWidth: 0,
              pointRadius: 0,
              pointHoverRadius: 0,
              tension: 0.15,
              fill: { target: 0 },
              order: 1
            },
            {
              label: label + " min",
              data: [],
              borderColor: "rgba(59,130,246,0)",
              backgroundColor: "rgba(59,130,246,0.18)",
              borderWidth: 0,
              pointRadius: 0,
              pointHoverRadius: 0,
              tension: 0.15,
              fill: { target: 0 },
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          parsing: false,
          normalized: true,
          interaction: {
            mode: "index",
            intersect: false
          },
          scales: {
            x: {
              type: "linear",
              title: { display: true, text: "t (s)", color: "#94a3b8" },
              ticks: {
                color: "#94a3b8",
                maxTicksLimit: 6,
                callback(value) {
                  return formatTimeTick(value);
                }
              },
              grid: { color: "rgba(255,255,255,0.06)" }
            },
            y: {
              title: { display: true, text: "microstrain", color: "#94a3b8" },
              ticks: { color: "#94a3b8", maxTicksLimit: 6 },
              grid: { color: "rgba(255,255,255,0.06)" }
            }
          },
          plugins: {
            legend: {
              labels: {
                color: "#cbd5e1",
                boxWidth: 12,
                font: { size: 11 }
              }
            },
            tooltip: {
              backgroundColor: "rgba(15, 23, 42, 0.96)",
              borderColor: "rgba(255,255,255,0.10)",
              borderWidth: 1,
              callbacks: {
                title(items) {
                  if (!items || !items.length) return "";
                  return "t: " + formatTimeTick(items[0].parsed.x);
                },
                label(context) {
                  const y = Number(context.parsed.y).toFixed(3);
                  if (context.datasetIndex === 0) return `${label} mean: ${y}`;
                  if (context.datasetIndex === 1) return `${label} max: ${y}`;
                  if (context.datasetIndex === 2) return `${label} min: ${y}`;
                  return null;
                }
              }
            }
          }
        }
      });
    }

    function clearChart(chart) {
      chart.data.datasets.forEach(ds => ds.data = []);
      chart.options.scales.x.title.text = "t (s)";
      chart.update("none");
    }

    function clearAllCharts() {
      for (const key of CHANNEL_KEYS) {
        clearChart(charts[key]);
      }
    }

    function resetStatsText() {
      for (const key of CHANNEL_KEYS) {
        statsEls[key].innerHTML = `
          <div class="stat-mini">Mean<strong>--</strong></div>
          <div class="stat-mini">Min<strong>--</strong></div>
          <div class="stat-mini">Max<strong>--</strong></div>
        `;
      }
    }

    function switchToRun(payload) {
      activeRunId = payload.run_id || null;
      runStartMs = payload.run_started_at ? Date.parse(payload.run_started_at) : null;

      runIdText.textContent = activeRunId || "--";
      fileNameText.textContent = payload.file_name || "--";
      unitText.textContent = payload.unit || "microstrain";
      updatedAt.textContent = payload.updated_at || "--";
      lastUpdatedAtMs = null;

      clearAllCharts();
      resetStatsText();
    }

    function appendPoint(chart, x, mean, min, max) {
      const dsMean = chart.data.datasets[0].data;
      const dsMax = chart.data.datasets[1].data;
      const dsMin = chart.data.datasets[2].data;

      const lastMean = dsMean.length ? dsMean[dsMean.length - 1] : null;
      if (lastMean && lastMean.x === x) return;

      dsMean.push({ x, y: mean });
      dsMax.push({ x, y: max });
      dsMin.push({ x, y: min });

      if (dsMean.length > MAX_POINTS) {
        dsMean.splice(0, dsMean.length - MAX_POINTS);
        dsMax.splice(0, dsMax.length - MAX_POINTS);
        dsMin.splice(0, dsMin.length - MAX_POINTS);
      }

      const maxX = dsMean.length ? Number(dsMean[dsMean.length - 1].x) : 0;
      chart.options.scales.x.title.text = getTimeAxisLabel(maxX);

      chart.update("none");
    }

    function applyPayload(payload) {
      if (!payload || !payload.channels) return;

      if (!activeRunId || payload.run_id !== activeRunId) {
        switchToRun(payload);
      }

      if (!runStartMs && payload.run_started_at) {
        runStartMs = Date.parse(payload.run_started_at);
      }

      const ts = payload._received_at || payload.updated_at || null;
      if (!ts) return;

      const ms = Date.parse(ts);
      if (!Number.isFinite(ms)) return;

      lastUpdatedAtMs = ms;
      updatedAt.textContent = ts;
      runIdText.textContent = payload.run_id || "--";
      fileNameText.textContent = payload.file_name || "--";
      unitText.textContent = payload.unit || "microstrain";

      const x = runStartMs ? ((ms - runStartMs) / 1000.0) : (ms / 1000.0);

      for (const key of CHANNEL_KEYS) {
        const channel = payload.channels[key];
        if (!channel) continue;

        statsEls[key].innerHTML = `
          <div class="stat-mini">Mean<strong>${fmt(channel.mean)}</strong></div>
          <div class="stat-mini">Min<strong>${fmt(channel.min)}</strong></div>
          <div class="stat-mini">Max<strong>${fmt(channel.max)}</strong></div>
        `;

        appendPoint(
          charts[key],
          x,
          Number(channel.mean),
          Number(channel.min),
          Number(channel.max)
        );
      }
    }

    async function loadHistory() {
      try {
        const resp = await fetch(API_BASE + "/history", { cache: "no-store" });
        if (!resp.ok) return;

        const snapshot = await resp.json();
        if (!snapshot || !snapshot.run_id) return;

        switchToRun({
          run_id: snapshot.run_id,
          run_started_at: snapshot.run_started_at,
          file_name: snapshot.file_name,
          updated_at: snapshot.latest?.updated_at || snapshot.run_started_at,
          unit: snapshot.latest?.unit || "microstrain"
        });

        for (const point of snapshot.points || []) {
          applyPayload(point);
        }
      } catch (e) {
        console.error("History load failed", e);
      }
    }

    setInterval(() => {
      if (!lastUpdatedAtMs) return;

      const currentAge = Math.max(0, Math.round((Date.now() - lastUpdatedAtMs) / 1000));

      if (currentAge <= 10) setStatus("LIVE", "ok");
      else if (currentAge <= 30) setStatus("STALE", "");
      else setStatus("OFFLINE", "bad");
    }, 1000);

    async function start() {
      for (const key of CHANNEL_KEYS) {
        makeCard(key);
      }

      await loadHistory();

      const ws = new WebSocket(WS_URL);

      ws.onopen = () => setStatus("CONNECTED", "ok");
      ws.onclose = () => setStatus("CLOSED", "bad");
      ws.onerror = () => setStatus("ERROR", "bad");

      ws.onmessage = (e) => {
        let msg;
        try {
          msg = JSON.parse(e.data);
        } catch {
          return;
        }

        const payload = msg.data || null;
        if (!payload) return;

        if (msg.type === "reset" || payload.reset === true) {
          switchToRun(payload);
          setStatus("NEW RUN", "ok");
          return;
        }

        applyPayload(payload);
        setStatus("LIVE", "ok");
      };
    }

    start();
  </script>
</body>
</html>
